# Configuración para el perfil de pruebas E2E

# Configuración de la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA y Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Desactivar la inicialización de la base de datos por defecto, usaremos nuestros scripts
spring.sql.init.mode=always

# Especificar el script de datos para las pruebas E2E
spring.sql.init.data-locations=classpath:data-e2e-test.sql

# Desactivamos Kafka explícitamente para el perfil e2e
spring.kafka.consumer.enabled=false
spring.kafka.producer.enabled=false

# Habilitar la consola H2 para depuración
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Propiedades de la aplicación requeridas
infinia.sports.shipping-cost=4.99

# Configuración de correo ficticia para el arranque
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
