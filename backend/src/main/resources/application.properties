# Perfil activo
spring.profiles.active=dev

# Configuración para H2 (base de datos en memoria para desarrollo)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=100

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Configuración del servidor
server.port=8080

# Configuración de JWT
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration=1800000

# Configuración de seguridad
spring.security.user.name=admin
spring.security.user.password=admin

# Configuración de logging
logging.level.org.springframework=INFO
logging.level.com.infinia.sports=DEBUG


# Configuración de SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Configuración de MongoDB
spring.data.mongodb.host=localhost

# Fuerza el log de mappings de endpoints
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.level.org.springframework.boot.autoconfigure.web=INFO

spring.data.mongodb.port=27017
spring.data.mongodb.database=infinia-sports
spring.data.mongodb.auto-index-creation=true


# MAIL
# Configuración del servidor de correo saliente (SMTP)
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
# spring.mail.password debe configurarse mediante variable de entorno para evitar exponer secretos
spring.mail.password=${SENDGRID_API_KEY:}


# Propiedades extendidas de JavaMail
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

infinia.sports.shipping-cost=4.99

# Configuracion de almacenamiento de imagenes
storage.location.images=../frontend/public
storage.upload-path.images=
# ============================================
# SPRING BOOT ACTUATOR - Monitorizaci�n
# ============================================
# Exponer todos los endpoints de actuator (para desarrollo)
# En producci�n, limitar a: health,info,metrics
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,httptrace,threaddump,heapdump,flyway
management.endpoints.web.base-path=/actuator

# Configuraci�n del endpoint health
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.mongo.enabled=true
management.health.diskspace.enabled=true

# Configuraci�n del endpoint info
info.app.name=Infinia Sports Backend
info.app.description=E-commerce de productos deportivos
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# M�tricas
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true


